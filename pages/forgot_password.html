<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #978B7F;
            font-family: "Times New Roman", serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .frame-container {
            display: flex;
            justify-content: center;
            gap: 250px;
            align-items: center;
            width: 100%;
            padding: 20px 0 0 0;
            z-index: 2;
        }
        .frame-container img {
            width: 350px;
        }
        .title {
            text-align: center;
            color: #7E572C;
            font-size: 70px;
            margin-top: 50px; 
            margin-bottom: 100px;
            position: relative;
            z-index: 3;
        }
        .main-layout {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .border-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: -350px;
            padding: 0 20px;
            pointer-events: none;
            z-index: 1;
        }
        .border-container img {
            width: 200px;
        }
        .form-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            position: relative;
            z-index: 4;
            margin-top: -10px; 
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; 
            width: 100%;
            max-width: 400px;
        }
        input[type="email"], input[type="password"] {
            text-align: center;
            color: #2B2115;
            font-size: 24px;
            width: 100%;
            background: transparent;
            border: 2px solid #2B2115;
            border-radius: 8px;
            padding: 10px;
        }
        input::placeholder {
            color: #2B2115;
            opacity: 0.6;
        }
        button[type="submit"] {
            font-size: 16px;
            padding: 8px 16px;
            width: auto;
            min-width: 120px;
            color: white;
            background-color: #2B2115;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #3d2f1f;
        }
        .text-btn {
            font-size: 14px;
            color: #7E572C;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }
        .text-btn:hover {
            color: #5a3d20;
        }
        .error-message {
            color: white;
            font-size: 20px;
            text-align: center;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            color: white;
            font-size: 20px;
            text-align: center;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .instruction {
            color: #2B2115;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="frame-container">
        <img src="up_frame_without_center.png" alt="Top Frame Left">
        <img src="up_frame_without_center.png" alt="Top Frame Right" style="transform: scaleX(-1);">
    </div>

    <h1 class="title" id="pageTitle">Reset Password</h1>

    <div class="main-layout">
        <div class="border-container">
            <img src="border.png" alt="Left Border">
            <img src="border.png" alt="Right Border" style="transform: scaleX(-1);">
        </div>

        <div class="form-wrapper">
            <form id="authForm">
                <p class="instruction" id="formInstruction"></p>
                
                <!-- Step 1: Request Link Fields -->
                <div id="requestFields" style="width: 100%; display: none;">
                    <input type="email" id="email" name="email" placeholder="Email Address">
                </div>

                <!-- Step 2: New Password Fields -->
                <div id="resetFields" style="width: 100%; display: none; flex-direction: column; gap: 15px;">
                    <input type="password" id="new_password" name="new_password" placeholder="New Password">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password">
                </div>

                <button type="submit" id="submitBtn">Send Reset Link</button>
                <div id="statusMessage" class="success-message"></div>
                <div id="errorMessage" class="error-message"></div>
                <a href="login.html" class="text-btn">Back to Login</a>
            </form>
        </div>
    </div>

    <script>
        const authForm = document.getElementById('authForm');
        const statusMessage = document.getElementById('statusMessage');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const formInstruction = document.getElementById('formInstruction');
        const requestFields = document.getElementById('requestFields');
        const resetFields = document.getElementById('resetFields');
        const pageTitle = document.getElementById('pageTitle');

        const emailInput = document.getElementById('email');
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');

        // Extract token parameter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            pageTitle.textContent = "Reset Your Password";
            formInstruction.textContent = "Password must be at least 8 characters, include uppercase, lowercase, and a special character.";
            resetFields.style.display = "flex";
            submitBtn.textContent = "Update Password";

            // Disable hidden inputs to prevent native HTML focus validation errors
            emailInput.disabled = true;
            newPasswordInput.disabled = false;
            confirmPasswordInput.disabled = false;
        } else {
            pageTitle.textContent = "Reset Password";
            formInstruction.textContent = "Enter your email address to receive a password reset link.";
            requestFields.style.display = "block";
            submitBtn.textContent = "Send Reset Link";

            emailInput.disabled = false;
            newPasswordInput.disabled = true;
            confirmPasswordInput.disabled = true;
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            statusMessage.classList.remove('show');
            errorMessage.classList.remove('show');
            statusMessage.textContent = '';
            errorMessage.textContent = '';
            submitBtn.disabled = true;

            try {
                const targetUrl = !token ? 'http://localhost/project_task_manager/api/forgot_password.php' : `http://localhost/project_task_manager/api/reset_password.php?token=${encodeURIComponent(token)}`;
                const bodyParams = !token 
                    ? new URLSearchParams({ email: emailInput.value }) 
                    : new URLSearchParams({ 
                        new_password: newPasswordInput.value,
                        confirm_password: confirmPasswordInput.value
                      });

                const res = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: bodyParams
                });

                const contentType = res.headers.get("content-type");
                
                // If backend did not send valid JSON, extract text to identify error
                if (!contentType || !contentType.includes("application/json")) {
                    const rawText = await res.text();
                    console.error("Non-JSON Response received:", rawText);
                    
                    if (res.status === 404) {
                        throw new Error(`File not found: ${targetUrl}. Please check your PHP file path.`);
                    }
                    throw new Error("Server returned HTML instead of JSON. Check backend PHP file for errors.");
                }

                const data = await res.json();

                if (data.success) {
                    statusMessage.textContent = data.message || 'Success!';
                    statusMessage.classList.add('show');
                    if (token) {
                        setTimeout(() => window.location.href = 'login.html', 2500);
                    }
                } else {
                    errorMessage.textContent = data.message || 'An error occurred. Please try again.';
                    errorMessage.classList.add('show');
                }
            } catch (err) {
                console.error("Submit error details:", err);
                errorMessage.textContent = err.message || 'Network or server error.';
                errorMessage.classList.add('show');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

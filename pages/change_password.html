<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #978B7F;
            font-family: "Times New Roman", serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .frame-container {
            display: flex;
            justify-content: center;
            gap: 250px;
            align-items: center;
            width: 100%;
            padding: 20px 0 0 0;
            z-index: 2;
        }
        .frame-container img { width: 350px; }
        .title {
            text-align: center;
            color: #7E572C;
            font-size: 70px;
            margin-top: 50px;
            margin-bottom: 100px;
            position: relative;
            z-index: 3;
        }
        .main-layout {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .border-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: -350px;
            padding: 0 20px;
            pointer-events: none;
            z-index: 1;
        }
        .border-container img { width: 200px; }
        .form-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            position: relative;
            z-index: 4;
            margin-top: -10px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .fields { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        input[type="password"] {
            text-align: center;
            color: #2B2115;
            font-size: 24px;
            width: 100%;
            background: transparent;
            border: 2px solid #2B2115;
            border-radius: 8px;
            padding: 10px;
        }
        input::placeholder { color: #2B2115; opacity: 0.6; }
        button[type="submit"] {
            font-size: 16px;
            padding: 8px 16px;
            min-width: 120px;
            color: white;
            background-color: #2B2115;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover { background-color: #3d2f1f; }
        button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
        .text-link {
            font-size: 14px;
            color: #7E572C;
            text-decoration: underline;
        }
        .text-link:hover { color: #5a3d20; }
        .instruction {
            color: #2B2115;
            font-size: 16px;
            text-align: center;
        }
        .message {
            color: white;
            font-size: 20px;
            text-align: center;
            display: none;
        }
        .message.show { display: block; }
    </style>
</head>
<body>

    <div class="frame-container">
        <img src="up_frame_without_center.png" alt="Top Frame Left">
        <img src="up_frame_without_center.png" alt="Top Frame Right" style="transform: scaleX(-1);">
    </div>

    <h1 class="title">Change Password</h1>

    <div class="main-layout">
        <div class="border-container">
            <img src="border.png" alt="Left Border">
            <img src="border.png" alt="Right Border" style="transform: scaleX(-1);">
        </div>

        <div class="form-wrapper">
            <form id="changeForm">
                <p class="instruction">Enter your current password, then choose a new one. Use at least 8 characters, including an uppercase letter, a lowercase letter, and a special character.</p>

                <div class="fields">
                    <input type="password" id="current_password" name="current_password" placeholder="Current Password" autocomplete="current-password">
                    <input type="password" id="new_password" name="new_password" placeholder="New Password" autocomplete="new-password">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" autocomplete="new-password">
                </div>

                <button type="submit" id="submitBtn">Change Password</button>
                <div id="successMessage" class="message"></div>
                <div id="errorMessage" class="message"></div>
                <a href="main_page.html" class="text-link">Back to Dashboard</a>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('changeForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            successMessage.classList.remove('show');
            errorMessage.classList.remove('show');
            submitBtn.disabled = true;

            try {
                const body = new URLSearchParams({
                    current_password: document.getElementById('current_password').value,
                    new_password: document.getElementById('new_password').value,
                    confirm_password: document.getElementById('confirm_password').value
                });
                const res = await fetch('/project_task_manager/api/change_password.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body
                });
                const raw = await res.text();
                let data;
                try { data = JSON.parse(raw); }
                catch (_) { throw new Error('The server returned an error instead of a response. Check the PHP error log.'); }

                if (data.success) {
                    successMessage.textContent = data.message;
                    successMessage.classList.add('show');
                    form.reset();
                } else {
                    errorMessage.textContent = data.message || 'Could not change password.';
                    errorMessage.classList.add('show');
                }
            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.add('show');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
